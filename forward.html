<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Chat Exporter</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --primary: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: var(--panel-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      margin: 40px 20px;
    }
    h1 {
      margin-top: 0;
      font-size: 28px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.instruction {
      color: var(--text-muted);
      font-size: 16px;
      line-height: 1.5;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 32px;
    }
    .ai-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    .ai-card:hover {
      background: rgba(139, 92, 246, 0.1);
      border-color: var(--primary);
      transform: translateY(-4px);
    }
    .ai-card h3 {
      margin: 0 0 8px 0;
      color: var(--text-main);
    }
    .ai-card p {
      margin: 0;
      font-size: 14px;
      color: var(--text-muted);
    }
    .preview-section {
      margin-top: 40px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
    }
    .context-preview {
      margin-top: 16px;
      padding: 20px;
      background: #000;
      border-radius: 12px;
      border: 1px solid var(--border);
      max-height: 300px;
      overflow-y: auto;
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 13px;
      color: #a7f3d0;
      white-space: pre-wrap;
      line-height: 1.6;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: var(--primary);
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-size: 15px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #7c3aed;
    }
    .images {
      display: flex;
      gap: 16px;
      margin-top: 20px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .images img {
      height: 120px;
      border-radius: 8px;
      border: 1px solid var(--border);
      object-fit: cover;
    }
    @media print {
      @page { margin: 1cm; }
      body { background: white; color: black; margin: 0; padding: 0; }
      .container { box-shadow: none; border: none; margin: 0; padding: 0; max-width: 100%; }
      h1, p.instruction, .grid, button, .btn { display: none !important; }
      .preview-section { margin: 0; padding: 0; border: none; }
      .context-preview { max-height: none; overflow: visible; background: white; color: black; border: none; padding: 0; white-space: pre-wrap; font-size: 12px; }
      .images { display: block; overflow: visible; }
      .images div { display: block !important; margin-bottom: 20px; page-break-inside: avoid; break-inside: avoid; }
      .images img { height: auto; max-width: 100%; max-height: 90vh; object-fit: contain; border: none; page-break-inside: avoid; break-inside: avoid; display: block; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Chat Exporter</h1>
    <p class="instruction">Your conversation context has been packaged successfully. Select an AI destination below to open it in a new tab, then just paste (Cmd/Ctrl + V) the context into the chat.</p>
    
    <div class="grid">
      <div class="ai-card" data-url="https://chatgpt.com">
        <h3>ChatGPT</h3>
        <p>OpenAI</p>
      </div>
      <div class="ai-card" data-url="https://claude.ai">
        <h3>Claude</h3>
        <p>Anthropic</p>
      </div>
      <div class="ai-card" data-url="https://gemini.google.com">
        <h3>Gemini</h3>
        <p>Google</p>
      </div>
    </div>

    <div class="preview-section">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
        <h3 style="margin: 0; flex-grow: 1;">Context Payload Preview</h3>
        <button class="btn" id="pdf-btn" style="background: #10b981;">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          Save as PDF
        </button>
        <button class="btn" id="copy-btn">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
          Copy Text
        </button>
      </div>
      <div class="images" id="image-container"></div>
      <div class="context-preview" id="preview">Loading context data...</div>
    </div>
  </div>
  <script src="forward.js"></script>
</body>
</html>
